apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-deployment
  labels:
    app: my-app
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
      track: canary
  template:
    metadata:
      labels:
        app: my-app
        track: canary
    spec:
      containers:
      - name: my-app
        image: nginx:1.21
        ports:
        - containerPort: 80
