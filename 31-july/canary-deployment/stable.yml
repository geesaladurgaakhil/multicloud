apiVersion: apps/v1
kind: Deployment
metadata:
  name: stable-deployment
  labels:
    app: my-app
    track: stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: my-app
      track: stable
  template:
    metadata:
      labels:
        app: my-app
        track: stable
    spec:
      containers:
      - name: my-app
        image: nginx:1.19
        ports:
        - containerPort: 80
